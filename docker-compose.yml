version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mule_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mule_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mule_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mule_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mule_admin} -d ${POSTGRES_DB:-mule_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mule_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mule_admin}:${POSTGRES_PASSWORD:-mule_secure_pass}@db:5432/${POSTGRES_DB:-mule_platform}
      - ENVIRONMENT=production
      - ML_MODEL_PATH=/app/ml/models/mule_detector_pipeline.joblib
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mule_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
